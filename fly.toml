# Fly.io deployment configuration
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "jsp-guestbook"
primary_region = "sea"

[build]
  dockerfile = "Dockerfile.production"

[env]
  PORT = "8080"
  DB_PATH = "/data/guestbook.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "15s"
  timeout = "2s"
  grace_period = "5s"
  method = "get"
  path = "/guestbook/"

[[mounts]]
  source = "guestbook_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
